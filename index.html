<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Najot Maktab - Tanks Battle</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body class="bg-neutral-950 text-white font-sans overflow-hidden">
    <div id="app" class="min-h-screen flex flex-col items-center justify-center p-4">
      <!-- Menu Screen -->
      <div id="menu-screen" class="text-center max-w-2xl">
        <div class="absolute top-8 right-8 bg-neutral-900 border border-emerald-500/30 p-4 rounded-3xl flex items-center gap-3 shadow-2xl">
          <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-xl">💰</div>
          <div class="flex flex-col items-start">
            <span class="text-[10px] uppercase text-neutral-500 font-black">Umumiy Balans</span>
            <span id="total-money-display" class="font-mono font-black text-emerald-400 text-2xl leading-none">$0</span>
          </div>
        </div>
        <h1 class="text-7xl font-black tracking-tighter uppercase italic mb-2">
          Najot <span class="text-emerald-500">Maktab</span>
        </h1>
        <p class="text-neutral-500 tracking-[0.3em] uppercase text-sm mb-12">Tank Battle Simulator</p>
        
        <div class="flex flex-col items-center justify-center gap-4 mb-8">
          <div class="flex gap-4">
            <button id="coop-toggle" class="flex items-center gap-3 px-6 py-3 rounded-2xl border-2 bg-neutral-900 border-neutral-800 text-neutral-500 transition-all font-bold uppercase cursor-pointer">
              Sherik bilan (2 Player)
            </button>
          </div>
          
          <div class="flex flex-col gap-2">
            <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Atmosfera Tanlang</p>
            <div id="atmosphere-grid" class="flex gap-2">
              <!-- Atmospheres will be injected here -->
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Tank Tanlang</p>
            <div id="tank-type-grid" class="flex gap-2">
              <!-- Tank types will be injected here -->
            </div>
          </div>
        </div>

        <div id="mode-grid" class="grid grid-cols-3 gap-4 mb-12">
          <!-- Modes will be injected here -->
        </div>

        <!-- Playtime Rewards -->
        <div class="mb-12 p-6 bg-neutral-900/50 border border-neutral-800 rounded-3xl">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-black uppercase tracking-widest text-neutral-500">O'yin Vaqti Sovg'alari</h3>
            <span id="playtime-display" class="font-mono text-emerald-500 font-bold">0:00</span>
          </div>
          <div id="rewards-container" class="grid grid-cols-4 gap-3">
            <!-- Rewards will be injected here -->
          </div>
        </div>

        <button id="start-btn" class="group relative px-12 py-6 bg-emerald-500 text-black rounded-full font-black uppercase italic text-3xl hover:scale-110 transition-transform flex items-center gap-4 mx-auto shadow-[0_0_30px_rgba(16,185,129,0.4)] cursor-pointer">
          O'ynash (Start)
        </button>
      </div>

      <!-- Game Screen -->
      <div id="game-screen" class="hidden relative">
        <div id="live-timer" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-xl px-4 py-2 rounded-2xl border border-white/10 font-mono font-black text-white z-40">0:00</div>
        <div class="flex justify-between items-center mb-4 px-4 w-full">
          <div class="flex items-center gap-4">
            <div class="bg-red-500/20 border border-red-500/30 px-4 py-2 rounded-xl">
              <span class="text-xs font-bold uppercase text-red-400 block">Qizil Jamoa</span>
              <span id="score-red" class="text-2xl font-black italic">0</span>
            </div>
            <button id="leave-btn" class="p-3 bg-neutral-800 hover:bg-red-500 rounded-xl transition-colors group font-bold uppercase text-[10px] cursor-pointer">
              Chiqish
            </button>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Rejim</div>
            <div id="current-mode" class="text-xl font-black italic text-emerald-500">1vs1</div>
            <div class="text-[10px] text-emerald-500 uppercase font-black mt-1">Achko: <span id="player-score-display">0</span></div>
          </div>
          <div class="bg-blue-500/20 border border-blue-500/30 px-4 py-2 rounded-xl text-right">
            <span class="text-xs font-bold uppercase text-blue-400 block">Ko'k Jamoa</span>
            <span id="score-blue" class="text-2xl font-black italic">0</span>
          </div>
        </div>

        <canvas id="game-canvas" width="800" height="600" class="rounded-3xl border-4 border-neutral-800 shadow-2xl bg-neutral-900"></canvas>

        <!-- HUDs -->
        <div id="hud-red" class="absolute top-24 left-4 flex flex-col gap-2"></div>
        <div id="hud-blue" class="absolute top-24 right-4 flex flex-col items-end gap-2"></div>
      </div>

      <!-- Shop Overlay -->
      <div id="shop-overlay" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-neutral-900 p-8 rounded-3xl border-2 border-emerald-500 w-96">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black uppercase italic">Qurol Do'koni</h2>
            <button id="close-shop" class="text-neutral-500 font-bold uppercase text-xs cursor-pointer">Yopish</button>
          </div>
          <div id="shop-items" class="grid gap-3"></div>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div id="game-over-overlay" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md">
        <div class="text-center">
          <h2 id="winner-text" class="text-7xl font-black uppercase italic mb-4">Red Victory!</h2>
          <div class="flex gap-4 justify-center">
            <button id="rematch-btn" class="px-8 py-4 bg-white text-black rounded-full font-black uppercase italic hover:scale-105 transition-transform cursor-pointer">Qaytadan</button>
            <button id="menu-btn" class="px-8 py-4 bg-neutral-800 text-white rounded-full font-black uppercase italic hover:scale-105 transition-transform cursor-pointer">Menyu</button>
          </div>
        </div>
      </div>

      <div id="footer-controls" class="mt-8 flex gap-12 text-neutral-600 text-[10px] font-bold uppercase tracking-[0.2em]">
        <div class="text-center">
          <p class="text-red-500 mb-1">Player 1 (Red)</p>
          WASD to Move • Space to Fire
        </div>
        <div id="p2-controls" class="text-center hidden">
          <p class="text-blue-500 mb-1">Player 2 (Blue)</p>
          Arrows to Move • Enter to Fire
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
